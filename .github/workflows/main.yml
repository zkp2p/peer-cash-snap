name: Main

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-workflows:
    name: Check workflows
    runs-on: ubuntu-latest
    steps:
      - name: Patch hosted action runtime
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: zkp2p/.github/actions/patch-node24@2d18c4a7aba9f63b1878b140852f275cac14f911

      - name: Configure dependency caching
        shell: bash
        run: echo 'Low-risk environment detected. Enabling cache for optimized performance.'

      - name: Checkout repository
        if: ${{ hashFiles('.git') == '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Download node_modules cache
        id: download-node-modules
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('yarn.lock') }}-default

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.download-node-modules.outputs.cache-hit != 'true' && 'yarn' || '' }}

      - name: Install dependencies
        if: ${{ steps.download-node-modules.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          COMMAND: yarn --immutable
          MAX_RETRIES: 5
        run: |
          command() {
            "$SHELL" -c "$COMMAND"
          }

          for i in $(seq 1 "$MAX_RETRIES"); do
            if command; then
              exit 0
            fi

            echo "Attempt $i failed, retrying in $((2 ** (i - 1))) seconds..."
            sleep $((2 ** (i - 1)))
          done
          echo "::error::Command failed after $MAX_RETRIES attempts."
          exit 1

      - name: Run allow-scripts
        if: ${{ steps.download-node-modules.outputs.cache-hit == 'true' }}
        shell: bash
        env:
          COMMAND: |
            if yarn bin allow-scripts &>/dev/null; then
              yarn allow-scripts
            fi
          MAX_RETRIES: 3
        run: |
          command() {
            "$SHELL" -c "$COMMAND"
          }

          for i in $(seq 1 "$MAX_RETRIES"); do
            if command; then
              exit 0
            fi

            echo "Attempt $i failed, retrying in $((2 ** (i - 1))) seconds..."
            sleep $((2 ** (i - 1)))
          done
          echo "::error::Command failed after $MAX_RETRIES attempts."
          exit 1
      - name: Download actionlint
        id: download-actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/7fdc9630cc360ea1a469eed64ac6d78caeda1234/scripts/download-actionlint.bash) 1.7.12
        shell: bash
      - name: Check workflow files
        run: ${{ steps.download-actionlint.outputs.executable }} -color
        shell: bash

  build-lint-test:
    name: Build, lint, and test
    uses: ./.github/workflows/build-lint-test.yml

  all-jobs-completed:
    name: All jobs completed
    runs-on: ubuntu-latest
    needs:
      - check-workflows
      - build-lint-test
    outputs:
      PASSED: ${{ steps.set-output.outputs.PASSED }}
    steps:
      - name: Set PASSED output
        id: set-output
        run: echo "PASSED=true" >> "$GITHUB_OUTPUT"

  all-jobs-pass:
    name: All jobs pass
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: all-jobs-completed
    steps:
      - name: Check that all jobs have passed
        run: |
          passed="${{ needs.all-jobs-completed.outputs.PASSED }}"
          if [[ $passed != "true" ]]; then
            exit 1
          fi
