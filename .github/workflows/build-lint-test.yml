name: Build, Lint, and Test

on:
  workflow_call:

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    steps:
      - name: Patch hosted action runtime
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: zkp2p/.github/actions/patch-node24@4ef0030bb0aca98a6c4a6378dbf48ad159ff25d4

      - name: Configure dependency caching
        shell: bash
        run: echo 'Low-risk environment detected. Enabling cache for optimized performance.'

      - name: Checkout repository
        if: ${{ hashFiles('.git') == '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Download node_modules cache
        id: download-node-modules
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('yarn.lock') }}-default

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.download-node-modules.outputs.cache-hit != 'true' && 'yarn' || '' }}

      - name: Install dependencies
        if: ${{ steps.download-node-modules.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          COMMAND: yarn --immutable
          MAX_RETRIES: 5
        run: |
          command() {
            "$SHELL" -c "$COMMAND"
          }

          for i in $(seq 1 "$MAX_RETRIES"); do
            if command; then
              exit 0
            fi

            echo "Attempt $i failed, retrying in $((2 ** (i - 1))) seconds..."
            sleep $((2 ** (i - 1)))
          done
          echo "::error::Command failed after $MAX_RETRIES attempts."
          exit 1

      - name: Run allow-scripts
        if: ${{ steps.download-node-modules.outputs.cache-hit == 'true' }}
        shell: bash
        env:
          COMMAND: |
            if yarn bin allow-scripts &>/dev/null; then
              yarn allow-scripts
            fi
          MAX_RETRIES: 3
        run: |
          command() {
            "$SHELL" -c "$COMMAND"
          }

          for i in $(seq 1 "$MAX_RETRIES"); do
            if command; then
              exit 0
            fi

            echo "Attempt $i failed, retrying in $((2 ** (i - 1))) seconds..."
            sleep $((2 ** (i - 1)))
          done
          echo "::error::Command failed after $MAX_RETRIES attempts."
          exit 1

      - name: Cache workspace
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('yarn.lock') }}-default

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - prepare
    steps:
      - name: Patch hosted action runtime
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: zkp2p/.github/actions/patch-node24@4ef0030bb0aca98a6c4a6378dbf48ad159ff25d4

      - name: Configure dependency caching
        shell: bash
        run: echo 'Low-risk environment detected. Enabling cache for optimized performance.'

      - name: Checkout repository
        if: ${{ hashFiles('.git') == '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Download node_modules cache
        id: download-node-modules
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('yarn.lock') }}-default

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.download-node-modules.outputs.cache-hit != 'true' && 'yarn' || '' }}

      - name: Install dependencies
        if: ${{ steps.download-node-modules.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          COMMAND: yarn --immutable
          MAX_RETRIES: 5
        run: |
          command() {
            "$SHELL" -c "$COMMAND"
          }

          for i in $(seq 1 "$MAX_RETRIES"); do
            if command; then
              exit 0
            fi

            echo "Attempt $i failed, retrying in $((2 ** (i - 1))) seconds..."
            sleep $((2 ** (i - 1)))
          done
          echo "::error::Command failed after $MAX_RETRIES attempts."
          exit 1

      - name: Run allow-scripts
        if: ${{ steps.download-node-modules.outputs.cache-hit == 'true' }}
        shell: bash
        env:
          COMMAND: |
            if yarn bin allow-scripts &>/dev/null; then
              yarn allow-scripts
            fi
          MAX_RETRIES: 3
        run: |
          command() {
            "$SHELL" -c "$COMMAND"
          }

          for i in $(seq 1 "$MAX_RETRIES"); do
            if command; then
              exit 0
            fi

            echo "Attempt $i failed, retrying in $((2 ** (i - 1))) seconds..."
            sleep $((2 ** (i - 1)))
          done
          echo "::error::Command failed after $MAX_RETRIES attempts."
          exit 1
      - name: Build
        run: yarn build
      - name: Upload Snap build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snap-${{ runner.os }}-${{ github.sha }}
          path: ./packages/snap/dist
          retention-days: 1
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs:
      - prepare
    steps:
      - name: Patch hosted action runtime
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: zkp2p/.github/actions/patch-node24@4ef0030bb0aca98a6c4a6378dbf48ad159ff25d4

      - name: Configure dependency caching
        shell: bash
        run: echo 'Low-risk environment detected. Enabling cache for optimized performance.'

      - name: Checkout repository
        if: ${{ hashFiles('.git') == '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Download node_modules cache
        id: download-node-modules
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('yarn.lock') }}-default

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.download-node-modules.outputs.cache-hit != 'true' && 'yarn' || '' }}

      - name: Install dependencies
        if: ${{ steps.download-node-modules.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          COMMAND: yarn --immutable
          MAX_RETRIES: 5
        run: |
          command() {
            "$SHELL" -c "$COMMAND"
          }

          for i in $(seq 1 "$MAX_RETRIES"); do
            if command; then
              exit 0
            fi

            echo "Attempt $i failed, retrying in $((2 ** (i - 1))) seconds..."
            sleep $((2 ** (i - 1)))
          done
          echo "::error::Command failed after $MAX_RETRIES attempts."
          exit 1

      - name: Run allow-scripts
        if: ${{ steps.download-node-modules.outputs.cache-hit == 'true' }}
        shell: bash
        env:
          COMMAND: |
            if yarn bin allow-scripts &>/dev/null; then
              yarn allow-scripts
            fi
          MAX_RETRIES: 3
        run: |
          command() {
            "$SHELL" -c "$COMMAND"
          }

          for i in $(seq 1 "$MAX_RETRIES"); do
            if command; then
              exit 0
            fi

            echo "Attempt $i failed, retrying in $((2 ** (i - 1))) seconds..."
            sleep $((2 ** (i - 1)))
          done
          echo "::error::Command failed after $MAX_RETRIES attempts."
          exit 1
      - name: Lint
        run: yarn lint
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi

  e2e-test:
    name: End-to-end Test
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Patch hosted action runtime
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: zkp2p/.github/actions/patch-node24@4ef0030bb0aca98a6c4a6378dbf48ad159ff25d4

      - name: Configure dependency caching
        shell: bash
        run: echo 'Low-risk environment detected. Enabling cache for optimized performance.'

      - name: Checkout repository
        if: ${{ hashFiles('.git') == '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Download node_modules cache
        id: download-node-modules
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('yarn.lock') }}-default

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.download-node-modules.outputs.cache-hit != 'true' && 'yarn' || '' }}

      - name: Install dependencies
        if: ${{ steps.download-node-modules.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          COMMAND: yarn --immutable
          MAX_RETRIES: 5
        run: |
          command() {
            "$SHELL" -c "$COMMAND"
          }

          for i in $(seq 1 "$MAX_RETRIES"); do
            if command; then
              exit 0
            fi

            echo "Attempt $i failed, retrying in $((2 ** (i - 1))) seconds..."
            sleep $((2 ** (i - 1)))
          done
          echo "::error::Command failed after $MAX_RETRIES attempts."
          exit 1

      - name: Run allow-scripts
        if: ${{ steps.download-node-modules.outputs.cache-hit == 'true' }}
        shell: bash
        env:
          COMMAND: |
            if yarn bin allow-scripts &>/dev/null; then
              yarn allow-scripts
            fi
          MAX_RETRIES: 3
        run: |
          command() {
            "$SHELL" -c "$COMMAND"
          }

          for i in $(seq 1 "$MAX_RETRIES"); do
            if command; then
              exit 0
            fi

            echo "Attempt $i failed, retrying in $((2 ** (i - 1))) seconds..."
            sleep $((2 ** (i - 1)))
          done
          echo "::error::Command failed after $MAX_RETRIES attempts."
          exit 1
      - name: Download Snap build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: snap-${{ runner.os }}-${{ github.sha }}
          path: ./packages/snap/dist
      - name: Run e2e tests
        run: yarn workspace @zkp2p/peer-cash-snap run test
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          fi
